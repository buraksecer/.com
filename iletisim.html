.contact { min-height:100dvh; display:grid; align-content:center; width:fit-content; max-width:100%; padding:20px; font:clamp(14px,3vw,18px)/1.7 ui-monospace,Menlo,monospace; }
.contact h1 { font:inherit; letter-spacing:normal; margin:0 0 1em; color:#a2e6bc; }

.contact a { overflow-wrap:anywhere; }
.contact footer { margin-top:1.5em; }
@media (prefers-reduced-motion:no-preference) {
.contact p { animation:type-line 1.1s steps(36,end) both; }
.contact p:nth-of-type(2) { animation-delay:1.1s; }
.contact p:nth-of-type(3) { animation-delay:2.2s; }
.contact p:focus-within { animation:none; }
}
@keyframes type-line { from { clip-path:inset(0 100% 0 0); } to { clip-path:inset(0); } }
</style>
